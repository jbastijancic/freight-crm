<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Freight Daddy CRM{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="company">{{ config.company.name }}</div>
    <div class="tagline">CRM</div>
  </div>
  <nav>
    <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' }}">
      <span class="icon">📊</span> Dashboard
    </a>
    <a href="{{ url_for('contacts_list') }}" class="{{ 'active' if 'contact' in request.endpoint }}">
      <span class="icon">👥</span> Contacts
    </a>
    <a href="{{ url_for('shipments_list') }}" class="{{ 'active' if 'shipment' in request.endpoint }}">
      <span class="icon">🚛</span> Shipments
    </a>
    <a href="{{ url_for('report') }}" class="{{ 'active' if request.endpoint == 'report' }}">
      <span class="icon">💰</span> Report
    </a>
  </nav>
</aside>

<div class="main">
  {% block content %}{% endblock %}
</div>

</body>
</html>
